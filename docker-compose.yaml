# Postgres + Kafka for local development, plus the application itself behind a compose profile.
#
#   ./mvnw spring-boot:run            starts Postgres and Kafka (Spring Boot does it for you) and
#                                     runs the application from your working copy - use this day to day
#
#   ./mvnw jib:dockerBuild && \
#     docker compose --profile full up   runs the built image alongside Postgres and Kafka
#
# The app service is behind the "full" profile precisely so the first command does not try to start
# it: Spring Boot's Docker Compose support activates no profiles, so it sees Postgres and Kafka only.
services:
  postgres:
    image: 'postgres:16-alpine'
    environment:
      POSTGRES_DB: room_reservation
      POSTGRES_USER: room_reservation
      POSTGRES_PASSWORD: room_reservation
    ports:
      - '5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U room_reservation']
      interval: 5s
      timeout: 3s
      retries: 5

  kafka:
    image: 'apache/kafka:3.8.0'
    ports:
      - '9092'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'

  app:
    profiles: ['full']
    image: 'room-reservation-service:latest'
    ports:
      - '8080:8080'
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/room_reservation
      SPRING_DATASOURCE_USERNAME: room_reservation
      SPRING_DATASOURCE_PASSWORD: room_reservation
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
